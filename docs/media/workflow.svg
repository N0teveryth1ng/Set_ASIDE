<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8B93A7"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#232A38"/>
    </pattern>
  </defs>

  <rect width="1360" height="1320" fill="#161A22"/>
  <rect width="1360" height="1320" fill="url(#dots)"/>

  <text x="60" y="58" font-size="26" font-weight="700" fill="#F3F4F6">Set-Aside — how money flows</text>
  <text x="60" y="84" font-size="14.5" fill="#9CA3AF">The journey on top, what runs it underneath.</text>

  <rect x="60" y="108" width="620" height="30" rx="6" fill="#10131A" stroke="#2B3346"/>
  <text x="76" y="128" font-size="13.5" font-weight="600" fill="#10B981">PHASE 1 · THE USER JOURNEY</text>

  <rect x="60" y="158" width="236" height="132" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <circle cx="88" cy="186" r="13" fill="#10B981"/>
  <text x="88" y="191" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">1</text>
  <text x="88" y="222" font-size="14.5" font-weight="600" fill="#E5E7EB">Landing</text>
  <text x="88" y="243" font-size="12.5" fill="#9CA3AF">“Do you have money? Is the</text>
  <text x="88" y="260" font-size="12.5" fill="#9CA3AF">tax set aside?” — one honest number.</text>

  <line x1="300" y1="224" x2="340" y2="224" stroke="#8B93A7" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="348" y="158" width="236" height="132" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <circle cx="376" cy="186" r="13" fill="#10B981"/>
  <text x="376" y="191" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>
  <text x="376" y="222" font-size="14.5" font-weight="600" fill="#E5E7EB">Magic-link sign-in</text>
  <text x="376" y="243" font-size="12.5" fill="#9CA3AF">Supabase Auth, no passwords.</text>
  <text x="376" y="260" font-size="12.5" fill="#9CA3AF">Two clicks in.</text>

  <line x1="588" y1="224" x2="628" y2="224" stroke="#8B93A7" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="636" y="158" width="236" height="132" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <circle cx="664" cy="186" r="13" fill="#10B981"/>
  <text x="664" y="191" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">3</text>
  <text x="664" y="222" font-size="14.5" font-weight="600" fill="#E5E7EB">Pick a preset</text>
  <text x="664" y="243" font-size="12.5" fill="#9CA3AF">Freelance · Business ·</text>
  <text x="664" y="260" font-size="12.5" fill="#9CA3AF">Personal · Creator.</text>

  <line x1="876" y1="224" x2="916" y2="224" stroke="#8B93A7" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="924" y="158" width="236" height="132" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <circle cx="952" cy="186" r="13" fill="#10B981"/>
  <text x="952" y="191" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">4</text>
  <text x="952" y="222" font-size="14.5" font-weight="600" fill="#E5E7EB">Record in &amp; out</text>
  <text x="952" y="243" font-size="12.5" fill="#9CA3AF">A transaction is the only</text>
  <text x="952" y="260" font-size="12.5" fill="#9CA3AF">input. Hand or CSV import.</text>

  <line x1="1164" y1="224" x2="1204" y2="224" stroke="#8B93A7" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="1212" y="158" width="88" height="132" rx="12" fill="#4F46E5" stroke="#6D63F2" stroke-width="1.5"/>
  <rect x="1244" y="158" width="56" height="132" rx="0" fill="url(#dots)" opacity="0"/>
  <text x="1256" y="205" font-size="13" font-weight="700" fill="#E6E6FF" text-anchor="middle">Net</text>
  <text x="1256" y="224" font-size="13" font-weight="700" fill="#E6E6FF" text-anchor="middle">Position</text>
  <text x="1256" y="253" font-size="10.5" fill="#C7C7FF" text-anchor="middle">trendline, tax</text>
  <text x="1256" y="268" font-size="10.5" fill="#C7C7FF" text-anchor="middle">set aside</text>

  <line x1="1304" y1="224" x2="1310" y2="224" stroke="#8B93A7" stroke-width="2" marker-end="url(#arr)" opacity="0"/>

  <rect x="60" y="318" width="620" height="30" rx="6" fill="#10131A" stroke="#2B3346"/>
  <text x="76" y="338" font-size="13.5" font-weight="600" fill="#4F46E5">PHASE 2 · UNDER THE HOOD</text>

  <rect x="60" y="368" width="285" height="128" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <text x="82" y="398" font-size="14.5" font-weight="600" fill="#E5E7EB">Next.js 14 · App Router · TS</text>
  <text x="82" y="420" font-size="12.5" fill="#9CA3AF">Server components render one screen;</text>
  <text x="82" y="437" font-size="12.5" fill="#9CA3AF">Recharts draws the trendline.</text>

  <rect x="377" y="368" width="285" height="128" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <text x="399" y="398" font-size="14.5" font-weight="600" fill="#E5E7EB">Supabase Auth + Postgres</text>
  <text x="399" y="420" font-size="12.5" fill="#9CA3AF">Magic link in, every account's</text>
  <text x="399" y="437" font-size="12.5" fill="#9CA3AF">rows live in owned tables.</text>

  <rect x="694" y="368" width="285" height="128" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <text x="716" y="398" font-size="14.5" font-weight="600" fill="#E5E7EB">Prisma ORM · Row Level Security</text>
  <text x="716" y="420" font-size="12.5" fill="#9CA3AF">Query-safe writing; every owned</text>
  <text x="716" y="437" font-size="12.5" fill="#9CA3AF">table is RLS-enforced.</text>

  <rect x="1011" y="368" width="289" height="128" rx="12" fill="#1C2230" stroke="#3A445C" stroke-width="1.5"/>
  <text x="1033" y="398" font-size="14.5" font-weight="600" fill="#E5E7EB">lib/ledger — rules engine</text>
  <text x="1033" y="420" font-size="12.5" fill="#9CA3AF">Computes Net Position and the</text>
  <text x="1033" y="437" font-size="12.5" fill="#9CA3AF">tax set-aside each period.</text>

  <rect x="60" y="536" width="1240" height="96" rx="14" fill="#232A38" stroke="#3A445C" stroke-width="1.5"/>
  <path d="M120 584 L120 536 L60 584 Z" fill="#232A38" stroke="#3A445C" stroke-width="1.5"/>
  <path d="M120 632 L120 680 L60 632 Z" fill="#232A38" stroke="#3A445C" stroke-width="1.5"/>
  <text x="120" y="584" font-size="13" font-weight="600" fill="#10B981">PRIVACY BY CONSTRUCTION</text>
  <text x="120" y="606" font-size="14" fill="#D1D5DB">Rows are scoped to the signed-in account everywhere — there are no shared documents, no hidden read paths.</text>
  <text x="120" y="628" font-size="13" fill="#9CA3AF">Every positive period automatically sets aside your chosen percentage (23% is the common default) so the tax bill is never a surprise.</text>

  <g stroke="#4F46E5" stroke-width="1.4" stroke-dasharray="2,4" opacity="0.6">
    <line x1="500" y1="368" x2="500" y2="536"/>
    <line x1="810" y1="368" x2="810" y2="536"/>
  </g>
  <text x="520" y="352" font-size="11.5" fill="#818CF8">server-side, RLS-guarded</text>

  <rect x="60" y="668" width="1240" height="90" rx="14" fill="#10131A" stroke="#2B3346" stroke-dasharray="6,5"/>
  <text x="120" y="706" font-size="15.5" font-weight="700" fill="#E5E7EB">“Do you have money? Is the tax set aside?”</text>
  <text x="120" y="730" font-size="13" fill="#9CA3AF">Sign up with a magic link, pick a preset, and the dashboard answers it in one screen — trendline, not a grid.</text>

  <rect x="60" y="818" width="620" height="30" rx="6" fill="#10131A" stroke="#2B3346"/>
  <text x="76" y="838" font-size="13.5" font-weight="600" fill="#818CF8">PHASE 3 · THE AGENT LAYER</text>

  <path d="M680 958 L680 986" stroke="#8B93A7" stroke-width="2" fill="none"/>
  <path d="M330 986 L1030 986" stroke="#8B93A7" stroke-width="2" fill="none"/>
  <path d="M330 986 L330 1004" stroke="#8B93A7" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1030 986 L1030 1004" stroke="#8B93A7" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="420" y="866" width="520" height="92" rx="12" fill="#4F46E5" stroke="#6D63F2" stroke-width="1.5"/>
  <text x="680" y="900" font-size="16" font-weight="700" fill="#EEF2FF" text-anchor="middle">Main orchestrator</text>
  <text x="680" y="924" font-size="12.5" fill="#C7C7FF" text-anchor="middle">You give the order. It delegates, verifies, and reports back.</text>
  <text x="680" y="943" font-size="11" fill="#A5B4FC" text-anchor="middle">Nothing merges or publishes without your approval.</text>

  <rect x="60" y="1010" width="540" height="200" rx="12" fill="#1C2230" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="92" cy="1042" r="13" fill="#4F46E5"/>
  <text x="92" y="1047" font-size="13" font-weight="700" fill="#EEF2FF" text-anchor="middle">1</text>
  <text x="116" y="1048" font-size="15" font-weight="700" fill="#E5E7EB">Coding sub-agent</text>
  <text x="84" y="1080" font-size="12.5" fill="#9CA3AF">Builds features, fixes bugs, refactors this repo.</text>
  <text x="84" y="1099" font-size="12.5" fill="#9CA3AF">Follows lib/tokens.ts and ships every dark-mode pair.</text>
  <text x="84" y="1118" font-size="12.5" fill="#9CA3AF">Proves it: build, tests, and a real browser screenshot.</text>
  <rect x="76" y="1142" width="508" height="52" rx="8" fill="#10131A" stroke="#2B3346"/>
  <text x="90" y="1164" font-size="11.5" fill="#9CA3AF">edit: allow · bash: ask</text>
  <text x="90" y="1184" font-size="11.5" fill="#9CA3AF">Commits and pushes only when you tell it to.</text>

  <rect x="760" y="1010" width="540" height="200" rx="12" fill="#1C2230" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="792" cy="1042" r="13" fill="#10B981"/>
  <text x="792" y="1047" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>
  <text x="816" y="1048" font-size="15" font-weight="700" fill="#E5E7EB">Marketing sub-agent</text>
  <text x="784" y="1080" font-size="12.5" fill="#9CA3AF">Reads Reddit, X, Hacker News, Product Hunt and</text>
  <text x="784" y="1099" font-size="12.5" fill="#9CA3AF">competitors live — every claim dated and linked.</text>
  <text x="784" y="1118" font-size="12.5" fill="#9CA3AF">Returns pulse, trends, positioning, hooks, gaps.</text>
  <rect x="776" y="1142" width="508" height="52" rx="8" fill="#10131A" stroke="#2B3346"/>
  <text x="790" y="1164" font-size="11.5" fill="#9CA3AF">edit: deny · bash: deny · read-only</text>
  <text x="790" y="1184" font-size="11.5" fill="#9CA3AF">Researches and drafts. Never posts without approval.</text>

  <rect x="60" y="1240" width="1240" height="46" rx="10" fill="#10131A" stroke="#2B3346" stroke-dasharray="6,5"/>
  <text x="80" y="1269" font-size="12.5" fill="#9CA3AF">The marketing agent reads the same product facts the code does, so it never proposes a claim the app can't back.</text>

  <text x="60" y="1312" font-size="11.5" fill="#6B7280">Set-Aside · docs/media/workflow.svg</text>
</svg>